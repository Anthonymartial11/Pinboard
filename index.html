<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#1a1410" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>Idaho Power Board</title>
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-512.png" />
<link rel="icon" href="./icon-512.png" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background:#1a1410; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #board { position:fixed; inset:0; }
  #lock { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
    padding:24px calc(24px + env(safe-area-inset-right,0)) 24px calc(24px + env(safe-area-inset-left,0));
    background: radial-gradient(ellipse at 30% 20%, rgba(255,236,200,.10), transparent 60%), radial-gradient(circle at 50% 60%, #2a1c0e, #140d06 75%); }
  .lk-card { width:min(360px,100%); background:linear-gradient(#f2e7cd,#e7d8b4); border:1px solid rgba(90,60,20,.5); border-radius:8px;
    box-shadow:0 24px 60px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.3) inset; padding:30px 26px 26px; position:relative; transform:rotate(-.6deg); }
  .lk-pin { position:absolute; top:-13px; left:50%; margin-left:-13px; width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #ff8a80, #c62828 55%, #7f1010); box-shadow:0 3px 2px rgba(0,0,0,.4), 0 7px 10px rgba(0,0,0,.4); }
  .lk-stamp { display:inline-block; font-family:"Avenir Next Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:11px; letter-spacing:.28em;
    color:#7c1c14; border:2px solid rgba(124,28,20,.7); border-radius:3px; padding:3px 9px; transform:rotate(-3deg); margin-bottom:14px; }
  .lk-title { font-family:"Avenir Next Condensed","Arial Narrow",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.14em; font-size:23px; line-height:1.05; color:#20160c; }
  .lk-sub { font-family:"American Typewriter",Courier,monospace; font-size:12.5px; color:#5a4a30; margin-top:6px; }
  .lk-form { margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .lk-input { width:100%; padding:12px 13px; font-size:16px; color:#20160c; background:#fffdf6; border:1px solid rgba(90,60,20,.55); border-radius:5px; outline:none;
    font-family:"American Typewriter",Courier,monospace; letter-spacing:.06em; }
  .lk-input:focus { border-color:#7c1c14; box-shadow:0 0 0 3px rgba(124,28,20,.15); }
  .lk-btn { padding:12px; font-size:14px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;
    color:#f3e7c8; cursor:pointer; background:linear-gradient(#7c1c14,#5c130d); border:none; border-radius:5px; }
  .lk-btn:active { transform:translateY(1px); }
  .lk-btn:disabled { opacity:.6; }
  .lk-err { min-height:16px; font-family:"American Typewriter",Courier,monospace; font-size:12px; color:#a01212; }
  .lk-foot { margin-top:14px; font-family:"American Typewriter",Courier,monospace; font-size:10.5px; color:#8a7350; line-height:1.5; }
</style>
</head>
<body>
<div id="board"></div>
<div id="lock">
  <div class="lk-card">
    <div class="lk-pin"></div>
    <div class="lk-stamp">Restricted</div>
    <div class="lk-title">Idaho Power Board</div>
    <div class="lk-sub">Private file. Enter the password to open the board.</div>
    <form class="lk-form" id="lk-form">
      <input class="lk-input" id="lk-pw" type="password" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Password" />
      <button class="lk-btn" id="lk-go" type="submit">Unlock</button>
      <div class="lk-err" id="lk-err"></div>
    </form>
    <div class="lk-foot">Unlocks on this device only. After the first time, this app opens straight to the board.</div>
  </div>
</div>
