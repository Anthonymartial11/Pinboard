name: Ingest

on:
  schedule:
    - cron: "20 */3 * * *"
    - cron: "40 11 * * *"
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      what:
        description: "news, archive, weekly, or both"
        default: both

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

# Everything this job runs is sealed, and this opens it. Without it nothing
# starts, loudly, and a failed run sends mail. Set it once under
# Settings > Secrets and variables > Actions.
env:
  ARGUS_KEY: ${{ secrets.ARGUS_KEY }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: news
        if: github.event.schedule == '20 */3 * * *' || inputs.what == 'news' || inputs.what == 'both'
        run: node script/boot.mjs news-fetch

      - name: daily
        if: github.event.schedule == '40 11 * * *' || inputs.what == 'archive' || inputs.what == 'both'
        run: node script/boot.mjs archive

      - name: weekly
        if: github.event.schedule == '0 12 * * 0' || inputs.what == 'weekly'
        run: |
          node script/boot.mjs archive-owners
          node script/boot.mjs archive-entities

      - name: publish
        if: github.event.schedule != '20 */3 * * *' || inputs.what != 'news'
        run: node script/boot.mjs changes-publish

      - name: commit
        run: |
          git config user.name "ingest"
          git config user.email "ingest@users.noreply.github.com"
          git add news.json newsgeo.json changes.json archive 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "ingest"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((2 ** i))
            done
            echo "push failed after four tries"; exit 1
          fi
